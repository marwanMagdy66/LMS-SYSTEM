
services:
  postgres:
    image: postgres:16
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_local_password
      POSTGRES_DB: lms_db
    ports:
      - "5433:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data

volumes:
  lms_postgres_data:
